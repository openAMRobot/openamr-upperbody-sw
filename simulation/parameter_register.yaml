  # ------------------------------------------------------------------------------------------------ base motion limits
  base_speed_ceiling:
    quantity: base linear speed ceiling (Build 1)
    unit: m/s
    value: 0.5
    relation: at_most
    verification: design_decision
    source: "register SPEED-CEILING: 0.5 m/s until the measured stop acceptance; Nav2, smoother, ZLAC8015D and Gazebo at or below it"
    authority: {register: SPEED-CEILING, machine_checked: false}
    checks:
      - {sim: gazebo, read: gazebo.plugin, plugin: gz-sim-diff-drive-system, tag: max_linear_velocity, deviation: {value: 1.0, issue: deviations, note: "DiffDrive clamps at 1.0 m/s; the platform-sw limits table and test (separate PR) carry the full layer comparison"}}
    not_carried: "MuJoCo and Isaac wheel velocity servos have no speed limit; Nav2, smoother and ZLAC8015D are in platform-sw (limits table)"
    validation: "this test; platform-sw speed and deceleration layer test"
    owner: register
    calibration: "recorded stop tests at 0.2, 0.3 and 0.5 m/s (SPEED-CEILING)"

  base_travel_deceleration:
    quantity: base linear deceleration limit, travel
    unit: m/s^2
    value: 1.5
    verification: design_decision
    source: "register MASS-LEDGER (D-29): 1.5 m/s2 travel and 1.0 m/s2 hold-and-move, identical in Nav2, the smoother, the ZLAC8015D and Gazebo, in a PR after platform-sw#90"
    authority: {register: MASS-LEDGER, machine_checked: false}
    checks:
      - {sim: gazebo, read: gazebo.plugin, plugin: gz-sim-diff-drive-system, tag: min_linear_acceleration, scale: -1.0, deviation: {value: 0.5, issue: deviations, note: "DiffDrive -0.5 m/s2"}}
    not_carried: "MuJoCo and Isaac: no acceleration limit on the wheel servos"
    validation: "this test; platform-sw speed and deceleration layer test"
    owner: register
    calibration: "MP-04 stopping"

clocks:
  note: >-
    The checked inventory of every SIL timer is platform-sw openamrobot_sil/config/clock_inventory.yaml (platform-sw#158, 607a496);
    this list repeats only the timers that still run on host time, read on 19 Nov 2026. Not machine-checked here.
  host_time_remaining:
    - where: "platform-sw openamrobot_sil/vendor/can_sil/zlac8015d_emulator.py (vendored from platform-fw tools/can_sil)"
      what: "last receipt time and the 2000h link-loss timeout (time.monotonic)"
      inventory_status: to_change
      closes_with: "openAMRobot/openamr-platform-fw#58 (injectable clock, open, ff7e79b), then re-vendor (issue fw#57)"
    - where: "platform-sw openamrobot_sil/vendor/can_sil/canopen_common.py"
      what: "node thread tick, the dt of every emulator tick (ZLAC ramp integration, heartbeat period) and the SDO client timeout"
      inventory_status: to_change
      closes_with: "openAMRobot/openamr-platform-fw#58, then re-vendor"
    - where: "upperbody-sw openamrobot_openarm_emulator src/arm_emulator.cpp ArmEmulator::clock_now() (std::chrono::steady_clock)"
      what: >-
        frame receipt time, the bus timing model (frame transmission and reply release), the `now` passed to MotorModel::step
        (can_timeout_s, default 0 = off) and power-on time. The physics step dt and the MIT law run on the controller period
        (Gazebo time), so the Damiao emulator is mixed
      inventory_status: "not in a clock inventory (upperbody-sw has none)"
      closes_with: "to be assigned by Alex (upperbody-sw code owners @Brinex45 @panthera-momagdii)"
    - where: "firmware in Renode (platform-sw#144, renode_readonly)"
      what: "Renode virtual time, not locked to Gazebo or host (ratio to wall time 0.55 to 1.07, platform-sw#168)"
      inventory_status: "outside the clock contract"
      closes_with: "platform-sw#166 (reconciles #141 with the clock contract)"
