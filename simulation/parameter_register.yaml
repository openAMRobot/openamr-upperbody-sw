    authority: {document: "audits reality_gap_register.csv RG-SEN-031", machine_checked: false}
    checks:
      - {sim: gazebo, read: gazebo.sensor_on, frame: left_wrist_camera_optical_frame, expect: [], note: "no Gazebo sensor in the combined description"}
