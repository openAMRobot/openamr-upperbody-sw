      - {sim: mujoco, read: mujoco.camera, camera: head_camera, field: fovy, deviation: {value: 45.0, issue: deviations, note: "MuJoCo default, engine_overrides.yaml head_camera fovy unknown"}}
    tolerance: 1.0e-9
    validation: "this test"
    owner: "Team doc s7 Perception and Simulation (RG-SEN-029)"
    calibration: "file the datasheet; MP-18"

  left_wrist_camera_pose:
    quantity: left wrist camera frame in openarm_left_ee_base_link
    unit: "m, rad"
    value: {xyz: [0.0, 0.05, -0.03], rpy: [0.0, 0.0, 0.0]}
    verification: placeholder
    source: "datums.yaml left_wrist_camera_pose (placeholder, kit datum unknown); upstream camera_view_frame differs by 66.2 mm (platform-sw#168 F3)"
    authority: {repo: upperbody_sw, file: ros2/src/openamrobot_upperbody_description/config/datums.yaml, pose_keys: [datums, left_wrist_camera_pose, value]}
