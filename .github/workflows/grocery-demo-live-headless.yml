# SPDX-License-Identifier: MIT
# The live grocery demo launcher (scripts/run_grocery_demo_gui.sh), HEADLESS: what can be checked without a desktop.
#
#   1. the stub tests of the launcher (test_live_launcher: preflight read only, --setup asks first, vcan bookkeeping,
#      Ctrl-C cleanup, dead Gazebo detection; no ROS needed)
#   2. --preflight on the runner, without a display and under Xvfb (llvmpipe software OpenGL)
#   3. smoke A: --headless --no-mission --record (Gazebo server only) for a fixed time: readiness wait, the ROS bag,
#      cleanup of the processes and of the vcan interfaces the launcher created (vcan_aux is created beforehand and must
#      survive untouched)
#   4. smoke B (informational, does not fail the job): the Gazebo window, RViz and the follow camera under Xvfb with
#      Mesa's software renderer, --no-mission --record, for a fixed time
# None of this is a live GUI test on a desktop: Xvfb has no GPU and nobody looks at the windows. The desktop
# acceptance test (docs/demo/grocery_dark_store.md) is the only check of what a person sees. No mission runs here
# (grocery-demo.yml runs it). Simulation tooling only: never hardware, physical acceptance or safety evidence.
name: Grocery demo live launcher (headless)

on:
  pull_request:
    branches: [main, integration/baseline1]
    paths:
      - '.github/workflows/grocery-demo-live-headless.yml'
      - 'ros2/src/openamrobot_build1_scene/scripts/run_grocery_demo_gui.sh'
      - 'ros2/src/openamrobot_build1_scene/scripts/live_demo_preflight.py'
      - 'ros2/src/openamrobot_build1_scene/scripts/live_demo_wait.py'
      - 'ros2/src/openamrobot_build1_scene/scripts/gz_follow.py'
      - 'ros2/src/openamrobot_build1_scene/launch/grocery_demo_gui.launch.py'
      - 'ros2/src/openamrobot_build1_scene/rviz/grocery_demo.rviz'
      - 'ros2/src/openamrobot_build1_scene/test/test_live_launcher.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: openamrobot_build1_scene
  PACKAGE_DIR: ws/src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene
  ROS_APT_SOURCE_VERSION: '1.3.0'

jobs:
  live-headless:
    name: Live launcher, headless (preflight, stub tests, Xvfb smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: "ENV/INFRA: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source)"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools ffmpeg xvfb mesa-utils x11-utils
          sudo rosdep init || echo "rosdep init: already initialized"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Read the pins from the launcher
        id: pins
        run: |
          python3 - "$PACKAGE_DIR/scripts/run_grocery_demo_gui.sh" >> "$GITHUB_OUTPUT" <<'EOF'
          import re, sys
          text = open(sys.argv[1]).read()
          for key in ("PLATFORM_SW_SHA", "OPENARM_DESCRIPTION_SHA", "OPENARM_ROS2_SHA", "OPENARM_CAN_SHA",
                      "GZ_SIM_VENDOR", "GZ_TOOLS_VENDOR", "SDFORMAT_VENDOR"):
              value = re.search("^" + key + r"=(\S+)", text, re.M).group(1)
              print(f"{key.lower()}={value}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.platform_sw_sha }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description_sha }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_ros2
          ref: ${{ steps.pins.outputs.openarm_ros2_sha }}
          path: ws/src/upstream/openarm_ros2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_can
          ref: ${{ steps.pins.outputs.openarm_can_sha }}
          path: ws/src/upstream/openarm_can
          persist-credentials: false

      - name: "ENV/INFRA: vcan module (the launcher creates the interfaces itself)"
        run: |
          sudo apt-get install -y iproute2 can-utils
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "linux-modules-extra-$(uname -r) could not be installed"
          sudo modprobe vcan && echo "vcan module loaded" || echo "modprobe vcan failed"

      - name: "ENV/INFRA: pinned Gazebo vendor builds, rosdep and the stack"
        working-directory: ws
        run: |
          sudo apt-get install -y --allow-downgrades \
            "ros-jazzy-gz-sim-vendor=${{ steps.pins.outputs.gz_sim_vendor }}" \
            "ros-jazzy-gz-tools-vendor=${{ steps.pins.outputs.gz_tools_vendor }}" \
            "ros-jazzy-sdformat-vendor=${{ steps.pins.outputs.sdformat_vendor }}"
          sudo apt-mark hold ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy
          rosdep install --rosdistro jazzy --from-paths $(colcon list --base-paths src --packages-up-to "$PACKAGE" --paths-only) \
            --ignore-src -y -r
          sudo apt-get install -y python3-can ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup ros-jazzy-moveit ros-jazzy-joint-state-publisher ros-jazzy-rviz2 ros-jazzy-xacro \
            ros-jazzy-launch-testing-ament-cmake ros-jazzy-ament-cmake-pytest

      - name: "BUILD: colcon build"
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to "$PACKAGE" --event-handlers console_cohesion+

      - name: "1. Stub tests of the launcher (no ROS needed by the tests)"
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select "$PACKAGE" --event-handlers console_direct+ --return-code-on-test-failure \
            --ctest-args -R '^test_live_launcher$'
          colcon test-result --test-result-base "build/$PACKAGE" --verbose

      - name: "2. --preflight, no display and under Xvfb (read only)"
        working-directory: ws
        run: |
          launcher="install/$PACKAGE/lib/$PACKAGE/run_grocery_demo_gui.sh"
          set +e
          env -u DISPLAY bash "$launcher" --preflight --headless --ws "$PWD" | tee ../preflight_headless.txt
          echo "PREFLIGHT_HEADLESS_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          xvfb-run -a -s "-screen 0 1920x1080x24" bash "$launcher" --preflight --ws "$PWD" | tee ../preflight_xvfb.txt
          echo "PREFLIGHT_XVFB_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          { echo '### Preflight (headless runner, Xvfb)'; echo '```'; cat ../preflight_xvfb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "3. Smoke A: --headless --no-mission --record (Gazebo server only)"
        id: smoke_a
        working-directory: ws
        run: |
          # An interface that existed before the run: the launcher must keep it as it is.
          sudo ip link add dev vcan_aux type vcan && sudo ip link set vcan_aux mtu 16 && sudo ip link set vcan_aux up
          set +e
          bash "install/$PACKAGE/lib/$PACKAGE/run_grocery_demo_gui.sh" --ws "$PWD" --headless --no-mission --record \
            --duration 240 --ready-timeout 1200 --log-dir "$PWD/smoke_a" 2>&1 | tee ../smoke_a.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "launcher exit $rc"
          cat smoke_a/ready.log smoke_a/cleanup.txt
          source /opt/ros/jazzy/setup.bash
          ros2 bag info smoke_a/live_bag | tee ../smoke_a_bag.txt
          ip -details link show type vcan | tee ../smoke_a_vcan_after.txt
          grep -q 'vcan_aux' ../smoke_a_vcan_after.txt || { echo "FAIL: vcan_aux (not created by the run) is gone"; exit 1; }
          for i in vcan_drive vcan_bms vcan_arm_l vcan_arm_r; do
            ! grep -q "$i" ../smoke_a_vcan_after.txt || { echo "FAIL: $i (created by the run) was not deleted"; exit 1; }
          done
          if pgrep -a -f 'gz sim|ros2 launch openamrobot_build1_scene'; then echo "FAIL: processes survived"; exit 1; fi
          grep -q 'ready after' smoke_a/ready.log || { echo "FAIL: not ready"; exit 1; }
          [ "$rc" = "0" ] || { echo "FAIL: launcher exit $rc"; exit 1; }
          sudo ip link delete vcan_aux

      - name: "4. Smoke B (informational): Gazebo window, RViz and follow camera under Xvfb, software OpenGL"
        id: smoke_b
        if: ${{ !cancelled() && steps.smoke_a.outcome == 'success' }}
        continue-on-error: true
        working-directory: ws
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" bash "install/$PACKAGE/lib/$PACKAGE/run_grocery_demo_gui.sh" \
            --ws "$PWD" --no-mission --record --duration 420 --ready-timeout 1500 --log-dir "$PWD/smoke_b" 2>&1 | tee ../smoke_b.txt
          rc=${PIPESTATUS[0]}
          echo "launcher exit $rc"
          grep -h 'gz_follow:' smoke_b/views.log || echo "no gz_follow line in views.log"
          grep -c 'rviz2' smoke_b/views.log || true
          [ -f smoke_b/screen.mp4 ] && ffmpeg -hide_banner -loglevel error -sseof -5 -i smoke_b/screen.mp4 -frames:v 1 smoke_b/last_frame.png
          ls -la smoke_b
          { echo '### Smoke B (Xvfb, llvmpipe; not a desktop test)'; echo '```'; grep '\[grocery demo\]' ../smoke_b.txt | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = "0" ] && grep -q 'gz_follow: confirmed' smoke_b/views.log

      - name: Result
        if: always()
        run: |
          echo "preflight (no display, --headless) exit: ${PREFLIGHT_HEADLESS_RC:-not run}"
          echo "preflight (Xvfb) exit:                   ${PREFLIGHT_XVFB_RC:-not run}"
          echo "smoke A (headless server):               ${{ steps.smoke_a.outcome }}"
          echo "smoke B (Xvfb GUI, informational):       ${{ steps.smoke_b.outcome }}"
          echo "None of this is a desktop GUI test; see docs/demo/grocery_dark_store.md, Desktop acceptance test."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grocery-demo-live-headless-attempt${{ github.run_attempt }}
          retention-days: 30
          path: |
            preflight_*.txt
            smoke_*.txt
            ws/smoke_a/
            ws/smoke_b/
            ws/smoke_*.logs.tar.gz
            ws/build/openamrobot_build1_scene/test_results/
          if-no-files-found: warn
