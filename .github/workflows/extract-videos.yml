# Scratch workflow (not for merge): extracts the recorded video of a finished grocery demo run and publishes it.
name: extract-videos
on:
  push:
    branches: [diag/extract-videos]
permissions:
  contents: write
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg (static build from PyPI)
        run: |
          python3 -m venv /tmp/ff && /tmp/ff/bin/pip install -q imageio-ffmpeg==0.5.1
          FF=$(/tmp/ff/bin/python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p "$HOME/bin" && ln -sf "$FF" "$HOME/bin/ffmpeg" && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Download the grocery run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p art && gh run download 44299879412 -R "$GITHUB_REPOSITORY" -D art || true
          find art -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.srt' -o -iname '*.vtt' -o -iname '*.png' -o -iname '*report*.json' \) -printf 'FILE %s %p\n' | head -80
      - name: Probe and convert
        run: |
          mkdir -p out
          find art -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' \) | while read -r f; do
            echo "== $f ($(stat -c %s "$f") bytes)"; ffmpeg -hide_banner -i "$f" 2>&1 | grep -E "Duration|Stream" || true
          done
          f=$(find art -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          s=$(find art -type f \( -iname '*.srt' \) | head -1)
          if [ -n "$s" ]; then
            ffmpeg -v error -y -i "$f" -vf "subtitles=$s" -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart -an out/grocery_demo_44299879412.mp4 || cp "$f" out/grocery_demo_44299879412.mp4
          else
            ffmpeg -v error -y -i "$f" -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart -an out/grocery_demo_44299879412.mp4
          fi
          cp "$f" "out/grocery_demo_44299879412_original.${f##*.}"
          ffmpeg -hide_banner -i out/grocery_demo_44299879412.mp4 2>&1 | grep -E "Duration|Stream" | sed 's/^/OUT /' || true
          ls -la out
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'N'
          Recording extracted from grocery dark store demonstrator run 44299879412 (18 Nov 2026), openamr-upperbody-sw demo/grocery-dark-store 6170e6a (draft PR #86). No simulation re-run.
          Result: 10 of 12 phase checks passed. Failed checks: shelf station position 0.0497 m against the 0.04 m limit (the known station offset; station alignment was off), and the odometry guard on the drive to the packing station (0.907 m against 0.56 m, caused by Gazebo wheel collision slip in turns). The pick, transport, placement into the tote and return to parking completed.
          Simulation-oracle profile: planning scene and object poses from Gazebo ground truth (planning_pose_source: ground_truth, object_pose_source: ground_truth). Gazebo Harmonic with DART, the real ROS 2 Jazzy stack (Nav2, MoveIt 2, ros2_control), emulated lift controller and arm motors over virtual CAN. Simulation evidence only: not hardware, perception or safety validation.
          Run: https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/44299879412
          N
          gh release create sim-grocery-demo-2026-11-18 out/* -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Digital twin recording: grocery dark store mission, 18 Nov 2026 (simulation, 10 of 12 checks)" --notes-file notes.md
          gh release view sim-grocery-demo-2026-11-18 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "ASSET \(.name) \(.size) \(.url)"'
