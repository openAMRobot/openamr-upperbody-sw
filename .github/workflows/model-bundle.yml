# SPDX-License-Identifier: MIT
# Builds the public model bundle (tools/model_bundle): the expanded URDFs of bundle.yaml, the meshes they reference, the lock
# with every commit and sha256, licences and a README, packed as openamrobot-2.0-model-<version>.zip.
#   - workflow_dispatch: builds the version given and uploads it as an artifact.
#   - push of a tag model-v<version>: the same, then attaches the zip to that tag's GitHub Release as a DRAFT. Publishing the
#     draft is a person's decision; this workflow never publishes a release and never edits a published one.
#   - pull_request touching the bundle tooling: builds a dev bundle and uploads it, so a change to the tooling is checked
#     before it merges. Not on every push or pull request.
# Evidence class: static (xacro expansion, check_urdf, file integrity). Not simulation, hardware or safety evidence.
name: Model bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version (letters, digits, '.', '+', '-'), for example 0.1.0-rc.1"
        required: true
  push:
    tags: ["model-v*"]
  pull_request:
    paths:
      - tools/model_bundle/**
      - tools/tests/test_model_bundle.py
      - .github/workflows/model-bundle.yml

permissions:
  contents: read

env:
  PINS_FILE: ws/src/openamr-upperbody-sw/ros2/src/openamrobot_upperbody_description/config/upstream_pins.yaml

jobs:
  bundle:
    name: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: jazzy

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT" in
            push) version="${REF_NAME#model-v}" ;;
            workflow_dispatch) version="$INPUT_VERSION" ;;
            pull_request) version="dev-pr${PR_NUMBER}-${HEAD_SHA:0:7}" ;;
          esac
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]; then
            echo "version '$version' is not allowed"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bundle version: $version"

      - name: Read the pins
        id: pins
        run: |
          python3 - "$PINS_FILE" >> "$GITHUB_OUTPUT" <<'EOF'
          import re, sys, yaml
          pins = yaml.safe_load(open(sys.argv[1]))["pins"]
          for key in ("openarm_description", "openamr_platform_sw"):
              value = pins[key]
              assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), f"{key}: {value!r} is not a full hash"
              print(f"{key}={value}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.openamr_platform_sw }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - name: Tests of the bundle tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest -q -p no:cacheprovider ws/src/openamr-upperbody-sw/tools/tests/test_model_bundle.py

      - name: rosdep (description closure)
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo apt-get update
          rosdep update --rosdistro jazzy
          paths=$(colcon list --base-paths src --packages-up-to openamrobot_upperbody_description --paths-only)
          echo "$paths"
          rosdep install --rosdistro jazzy --from-paths $paths --ignore-src -y

      - name: colcon build (description closure)
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to openamrobot_upperbody_description --event-handlers console_cohesion+

      - name: Build the bundle
        working-directory: ws
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 src/openamr-upperbody-sw/tools/model_bundle/build_bundle.py --version "$VERSION" --out dist --zip \
            --pins "../$PINS_FILE" \
            --source openamr-upperbody-sw=src/openamr-upperbody-sw \
            --source openamr-platform-sw=src/openamr-platform-sw \
            --source openarm_description=src/upstream/openarm_description

      - name: Check the bundle (check_urdf, sha256, mesh list)
        working-directory: ws/dist
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          dir="openamrobot-2.0-model-$VERSION"
          for urdf in "$dir"/urdf/*.urdf; do
            check_urdf "$urdf" > /dev/null
            echo "PASS  check_urdf  $urdf"
          done
          (cd "$dir" && sha256sum -c --quiet SHA256SUMS && echo "PASS  sha256sum -c SHA256SUMS")
          python3 ../src/openamr-upperbody-sw/tools/model_bundle/verify_bundle.py "$dir.zip"
          sha256sum "$dir.zip" | tee "$dir.zip.sha256"
          {
            echo "### Model bundle $VERSION"
            echo '```'
            cat "$dir.zip.sha256"
            python3 -c "import json,sys; l=json.load(open(sys.argv[1])); [print(c['urdf'], c['links'], 'links', c['joints'], 'joints', len(c['meshes']), 'meshes') for c in l['configurations']]; print(len(l['files']), 'files in the lock'); print('mjcf:', l['mjcf'])" "$dir/bundle_lock.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openamrobot-2.0-model-${{ steps.version.outputs.version }}
          path: |
            ws/dist/openamrobot-2.0-model-${{ steps.version.outputs.version }}.zip
            ws/dist/openamrobot-2.0-model-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/model-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openamrobot-2.0-model-${{ needs.bundle.outputs.version }}
          path: dist

      - name: Attach to the tag's draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -e
          zip="dist/openamrobot-2.0-model-$VERSION.zip"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "The release for $TAG is already published; this workflow does not change a published release."
              exit 1
            fi
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" --draft --verify-tag \
              --title "OpenAMRobot 2.0 model $VERSION (draft)" \
              --notes "Model bundle built by the Model bundle workflow from $TAG. Simulation and visualisation model, not hardware validation. See README.md and bundle_lock.json inside the zip. Draft: review before publishing."
          fi
