# SPDX-License-Identifier: MIT
# Diagnostics only (do not merge): parking variability of finished Baseline 1 acceptance runs.
# Downloads the artifacts of the listed runs and analyses their bags and mission JSON. It runs no mission, no Gazebo,
# no hardware and uses no secret beyond the job's read-only token.
name: diag parking variability

on:
  push:
    branches: [diag/parking-variability]

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # station_approach 1 (#164 station tree). station_alignment 0 or absent (input added at 29adcb8).
      RUNS: >-
        44110449067 44128368373 44196259900
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reader
        run: python3 -m venv /tmp/v && /tmp/v/bin/pip install mcap==1.6.0 mcap-ros2-support==0.6.0
      - name: Download and analyse
        run: |
          set +e
          for r in $RUNS; do
            mkdir -p "art/$r"
            gh run download "$r" -R "$GITHUB_REPOSITORY" -n baseline1-acceptance-attempt1 -D "art/$r" >/dev/null 2>&1 \
              || echo "PARKING_JSON {\"dir\": \"$r\", \"error\": \"download failed\"}"
            /tmp/v/bin/python tools/parking_diag/parking_analysis.py "art/$r"
            rm -rf "art/$r"
          done
