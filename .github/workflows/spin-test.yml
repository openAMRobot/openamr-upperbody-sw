# SPDX-License-Identifier: MIT
# EXPERIMENT ONLY (scratch branch diag/spin-test, never merged): turn-slip experiment in Gazebo DART, firmware_sil.
#
# Question: what causes the odometry heading error in turns in place seen by the grocery demonstrator (#86)? Candidates
# in the Gazebo model: (A) drive wheel friction direction fdir1 in the spinning wheel's collision frame, (B) the flat
# 46 mm wheel cylinder (effective track), (C) frictionless fixed castor spheres 0.4 mm above the drive contact plane.
# One job per model variant (ros2/src/openamrobot_build1_scene/openamrobot_build1_scene/spin_variants.py, applied to the
# plant URDF inside build1.launch.py when BUILD1_SPIN_VARIANT is set; no description package is edited). Each job runs
# test_spin_test (spin_test.py): +-pi/2 and +-pi in place at Nav2's 0.25 rad/s, and a 2 m straight, three repeats, arms
# parked, with a gz contact sensor on the floor. The report job prints the tables and the effect estimate per cause.
# Simulation evidence only: never hardware, physical acceptance or safety evidence. No secrets, no hardware.
name: Turn-slip experiment (diag/spin-test)

on:
  push:
    branches: [diag/spin-test]
    paths:
      - '.github/workflows/spin-test.yml'

permissions:
  contents: read

env:
  PACKAGE: openamrobot_build1_scene
  PACKAGE_DIR: ws/src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene
  # As baseline1-acceptance.yml at integration/baseline1 024ccb8: openamr-platform-sw integration/baseline1.
  PLATFORM_SW_SHA: 931e631db661b16d1057dfd1ab1d13ea606482e2
  ROS_APT_SOURCE_VERSION: '1.3.0'
  GZ_SIM_VENDOR: 0.0.13-1noble.20261031.125555
  GZ_TOOLS_VENDOR: 0.0.8-1noble.20261025.230735
  SDFORMAT_VENDOR: 0.0.14-1noble.20261031.120928
  GZ_SIM_VERSION: 8.15.0
  SDFORMAT_VERSION: 14.9.0
  BASELINE1_SEED: '20261117'
  PYTHONHASHSEED: '20261117'

jobs:
  spin:
    name: Spin test ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, A_iso, A_axial, B_sphere, B_thin, C_coplanar, C_friction, ALL]
    env:
      BUILD1_SPIN_VARIANT: ${{ matrix.variant }}
    steps:
      - name: "ENV/INFRA: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source, no GitHub API lookup)"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools ffmpeg
          sudo rosdep init || echo "rosdep init: already initialized"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Read the pins
        id: pins
        run: |
          python3 - "$PACKAGE_DIR/config/pins.yaml" >> "$GITHUB_OUTPUT" <<'EOF'
          import re, sys, yaml
          pins = yaml.safe_load(open(sys.argv[1]))["pins"]
          for key in ("platform_sw_pr145", "openarm_ros2", "openarm_can", "openarm_description"):
              value = pins[key]["sha"]
              assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), f"{key}: {value!r} is not a full hash"
              print(f"{key}={value}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ env.PLATFORM_SW_SHA }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_ros2
          ref: ${{ steps.pins.outputs.openarm_ros2 }}
          path: ws/src/upstream/openarm_ros2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_can
          ref: ${{ steps.pins.outputs.openarm_can }}
          path: ws/src/upstream/openarm_can
          persist-credentials: false

      - name: Workspace layout and pins
        working-directory: ws
        run: |
          # openamrobot_sil is the platform integration branch's (clock contract, #162 lift path, #166 launch API),
          # no longer the #145 pin.
          for d in src/openamr-upperbody-sw src/openamr-platform-sw src/upstream/*; do
            echo "$d $(git -C "$d" rev-parse HEAD)"
          done | tee ../pins.txt
          echo "wheel_radius in the built openamrobot_sil:"; grep -n wheel_radius src/openamr-platform-sw/ros2/src/openamrobot_sil/config/sil.yaml || true
          echo "wheel_radius in the integration description:"; grep -rn 'wheel_radius' src/openamr-platform-sw/ros2/src/openamrobot_description/urdf/*.xacro | head -5 || true
          { echo '### Pins'; echo '```'; cat ../pins.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "ENV/INFRA: virtual CAN"
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y iproute2 can-utils
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "linux-modules-extra-$(uname -r) could not be installed"
          sudo modprobe vcan || echo "modprobe vcan failed"
          sudo modprobe can_raw || echo "modprobe can_raw failed"
          set +e
          sh "$PACKAGE_DIR/scripts/setup_vcan_all.sh" 2>&1 | tee vcan.txt
          rc=${PIPESTATUS[0]}
          echo "VCAN_RC=$rc" >> "$GITHUB_ENV"
          ip -details link show type vcan | tee -a vcan.txt
          [ "$rc" = "0" ] || echo "ENV_REASON=setup_vcan_all.sh exit $rc: virtual CAN unavailable on this runner" >> "$GITHUB_ENV"

      - name: "ENV/INFRA: pinned Gazebo vendor builds (as openamr-platform-sw #152)"
        id: gazebo
        run: |
          sudo apt-get install -y --allow-downgrades \
            ros-jazzy-gz-sim-vendor=${GZ_SIM_VENDOR} \
            ros-jazzy-gz-tools-vendor=${GZ_TOOLS_VENDOR} \
            ros-jazzy-sdformat-vendor=${SDFORMAT_VENDOR}
          sudo apt-mark hold ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor

      - name: "ENV/INFRA: rosdep and the stack"
        id: deps
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy
          # The #167 extension package is built only for the opt-in alignment run (station_alignment 1).
          paths=$(colcon list --base-paths src --packages-up-to "$PACKAGE" --paths-only)
          rosdep install --rosdistro jazzy --from-paths $paths --ignore-src -y -r
          sudo apt-get install -y python3-can ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-moveit ros-jazzy-joint-state-publisher ros-jazzy-launch-testing-ament-cmake ros-jazzy-ament-cmake-pytest

      - name: "ENV/INFRA: check the pinned versions"
        id: versions
        run: |
          source /opt/ros/jazzy/setup.bash
          sim=$(gz sim --versions); sdf=$(gz sdf --versions)
          echo "gz sim ${sim}, gz sdf ${sdf}"
          dpkg-query -W -f='${Package} ${Version}\n' \
            | grep -E '^(ros-jazzy-(ros-base|rclcpp|ros-gz|gz-|ros2-control|controller-manager|hardware-interface|joint-trajectory-controller|xacro|moveit|navigation2|nav2-bringup)|python3-can)' \
            | sort | tee versions.txt
          { echo '### Package versions'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "${sim}" = "${GZ_SIM_VERSION}" || { echo "ENV/INFRA: expected gz-sim ${GZ_SIM_VERSION}, found ${sim}"; exit 1; }
          test "${sdf}" = "${SDFORMAT_VERSION}" || { echo "ENV/INFRA: expected sdformat ${SDFORMAT_VERSION}, found ${sdf}"; exit 1; }

      - name: "BUILD: colcon build"
        id: build
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to "$PACKAGE" --event-handlers console_cohesion+

      - name: "Static tests of the experiment (variant edits, arithmetic)"
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q -p no:cacheprovider "src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene/test/test_spin_variants.py"

      - name: "Experiment: turns in place and straight drives, variant ${{ matrix.variant }}"
        id: spin
        if: steps.build.outcome == 'success' && env.VCAN_RC == '0'
        working-directory: ws
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export BUILD1_LOG_DIR="$PWD/build1_logs"
          mkdir -p "$BUILD1_LOG_DIR"
          echo "nproc $(nproc), variant ${BUILD1_SPIN_VARIANT}"
          set +e
          colcon test --packages-select "$PACKAGE" --event-handlers console_direct+ --return-code-on-test-failure \
            --ctest-args -R '^test_spin_test$'
          echo "SPIN_RC=$?" >> "$GITHUB_ENV"
          colcon test-result --test-result-base "build/$PACKAGE" --verbose
          python3 "src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene/scripts/spin_report.py" build1_logs \
            --markdown "build1_logs/spin_report_${BUILD1_SPIN_VARIANT}.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spin-test-${{ matrix.variant }}
          retention-days: 30
          path: |
            ws/build1_logs/
            ws/log/latest_test/
            pins.txt
            versions.txt
          if-no-files-found: warn

      - name: Result
        if: always()
        run: |
          echo "spin test colcon rc: ${SPIN_RC:-not run} (0: the data of every segment were taken; no number is a limit)"
          [ "${SPIN_RC:-1}" = "0" ]

  report:
    name: Tables and effect estimates
    needs: spin
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spin-test-*
          path: artifacts
      - name: Report
        run: |
          python3 ros2/src/openamrobot_build1_scene/scripts/spin_report.py artifacts --markdown spin_report.md --json spin_summary.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spin-test-report
          retention-days: 30
          path: |
            spin_report.md
            spin_summary.json
