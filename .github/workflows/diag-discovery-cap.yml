# SPDX-License-Identifier: MIT
# Diagnostics only (do not merge): with ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST (as build1_harness.py sets), do 40
# participants on one host all discover each other? 40 small probe processes (tools/odom_freeze_diag/cap_probe.py) on a
# test topic of their own, no robot stack, no Gazebo, no hardware, no secrets. Also a smoke run of the DDS benchmark
# observer (tools/dds_benchmark/observer.py of branch diag/dds-benchmark) before it is used on the Baseline 1 workload.
name: diag discovery cap

on:
  push:
    branches: [diag/odom-freeze]
    paths: ['.github/workflows/diag-discovery-cap.yml', 'tools/odom_freeze_diag/cap_probe.py']

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.setting }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        setting: [fastdds_localhost, fastdds_localhost_raised_cap, cyclonedds_localhost]
    env:
      ROS_DOMAIN_ID: '119'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/dds-benchmark
          path: bench
          persist-credentials: false
      - name: ROS 2 Jazzy base, both RMWs
        run: |
          sudo apt-get update
          sudo apt-get install -y curl software-properties-common iproute2 python3-psutil
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-rmw-cyclonedds-cpp
          dpkg-query -W -f='${Package} ${Version}\n' | grep -E 'rmw-fastrtps-cpp|fastrtps |rmw-cyclonedds|cyclonedds |rclpy'
      - name: 40 participants, then who sees whom
        run: |
          source /opt/ros/jazzy/setup.bash
          case "${{ matrix.setting }}" in
            cyclonedds_localhost) export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ;;
            fastdds_localhost_raised_cap)
              export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
              python3 -I bench/tools/dds_benchmark/observer.py peers-xml 119 --count 120 > /tmp/peers.xml
              export FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/peers.xml ;;
            *) export RMW_IMPLEMENTATION=rmw_fastrtps_cpp ;;
          esac
          mkdir -p out logs obs
          python3 bench/tools/dds_benchmark/observer.py run --domain 119 --out obs --topics /cap/p0,/cap/p39 > logs/observer.log 2>&1 &
          obs=$!
          sleep 8
          pids=""
          for i in $(seq 0 39); do
            python3 tools/odom_freeze_diag/cap_probe.py member "$i" out > "logs/m$i.log" 2>&1 &
            pids="$pids $!"
            sleep 0.5
          done
          sleep 40
          ss -H -u -a -n -p > ss.txt
          python3 bench/tools/dds_benchmark/observer.py late --topics /cap/p0,/cap/p20,/cap/p31,/cap/p35,/cap/p39 | tail -1 | tee late.json
          kill -TERM $pids; sleep 5
          python3 tools/odom_freeze_diag/cap_probe.py report out 119 ss.txt
          kill -TERM $obs; wait $obs; echo "observer exit $?"
          tail -5 logs/observer.log
          python3 -c "import json; d=json.load(open('obs/observer_summary.json')); p=d['participants'][-1]; print('OBSERVER rmw', d['rmw'], 'participants', p['count'], 'max_index', p['max_index'], 'index0', p['indices'].get('0')); print('OBSERVER qos', json.dumps(d['qos'])[:600]); print('OBSERVER topics', json.dumps(d['topics'])[:600])"
          head -3 obs/processes.csv; wc -l obs/processes.csv
          echo "member logs with errors:"; grep -liE "error|fail|index" logs/m*.log | head; grep -hiE "error|fail|index" logs/m*.log | sort | uniq -c | head -5
