# SPDX-License-Identifier: MIT
# Build 1 scene: the full combined model in one Gazebo world on five virtual CAN buses, with Nav2 and MoveIt 2.
# Builds the workspace at the pins of ros2/src/openamrobot_build1_scene/config/pins.yaml, creates the virtual CAN
# interfaces on the runner (vcan by modprobe, CAN FD on the arm buses) and runs the package's tests headless.
# A test that needs virtual CAN and cannot have it is BLOCKED: it is counted apart, and the job does not pass.
# Simulation evidence only: never hardware, physical acceptance or safety evidence. No secrets, no hardware.
name: diag arm64 build only, upperbody and its closure (scratch)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: openamrobot_build1_scene
  # The mission's middleware settings (baseline1-acceptance.yml) instead of the default Fast DDS (#137): on Fast DDS
  # with localhost discovery the host stand-in's odometry publisher matched no subscriber in 2 of 5 scn10 launches;
  # on these settings 11 of 11 were clean.
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><Discovery><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>'
  PACKAGE_DIR: ws/src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene

jobs:
  scene:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    concurrency:
      group: build1-scene-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build on arm64
            runner: ubuntu-24.04-arm
          - name: build on amd64 (reference, same steps)
            runner: ubuntu-24.04
    steps:
      # ros-tooling/setup-ros looks the latest ros-apt-source tag up through the unauthenticated GitHub API, which
      # returned no tag on 17 Nov 2026 (rate limit) and made the download 404. The release is pinned here instead.
      - name: "ENV/INFRA: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source 1.3.0)"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools
          sudo apt-get install -y ros-jazzy-rmw-cyclonedds-cpp
          dpkg -s ros-jazzy-rmw-cyclonedds-cpp > /dev/null
          sudo rosdep init || echo "rosdep init: already initialized"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Read the pins
        id: pins
        run: |
          python3 - "$PACKAGE_DIR/config/pins.yaml" >> "$GITHUB_OUTPUT" <<'EOF'
          import re, sys, yaml
          pins = yaml.safe_load(open(sys.argv[1]))["pins"]
          for key in ("platform_sw_main", "platform_sw_sil", "openamrobot_interfaces", "openarm_ros2", "openarm_can", "openarm_description"):
              value = pins[key]["sha"]
              assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), f"{key}: {value!r} is not a full hash"
              print(f"{key}={value}")
          EOF
          cat "$GITHUB_OUTPUT"

      # openamr-platform-sw main: description, Nav2, perception and the docking model.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.platform_sw_main }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      # openamr-platform-sw integration/baseline1 (pins.yaml platform_sw_sil): only the package openamrobot_sil, the one
      # baseline1-acceptance.yml builds (clock contract #151/#158, lift on simulation time #162, #166). The #145 pin
      # ran every CTL-017 timer on host time, so its Hall rate checks faulted (F02, F03) below a real-time factor
      # of about 0.65. Nothing else of that head is built.
      # Platform #90 (main 98654688): safety_stop_gate_node and the public goal proxies import openamr_nav_msgs
      # (declared in openamrobot_nav2's package.xml). Its source must be in the workspace, or rosdep -r skips the key
      # and the nodes crash; so it is checked out and built explicitly here,
      # at the openamrobot_interfaces pin (the same commit as the acceptance workflow's INTERFACES_SHA).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamrobot-interfaces
          ref: ${{ steps.pins.outputs.openamrobot_interfaces }}
          path: ws/src/openamrobot-interfaces
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.platform_sw_sil }}
          path: ws/src/pins/platform-sil
          sparse-checkout: ros2/src/openamrobot_sil
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_ros2
          ref: ${{ steps.pins.outputs.openarm_ros2 }}
          path: ws/src/upstream/openarm_ros2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_can
          ref: ${{ steps.pins.outputs.openarm_can }}
          path: ws/src/upstream/openarm_can
          persist-credentials: false

      - name: Workspace layout
        working-directory: ws
        run: |
          # platform main has openamrobot_sil since #139 (69847ab). The platform_sw_sil pin carries the newer copy; colcon refuses
          # two packages of one name, so main's copy is ignored and only the pinned one is built.
          touch src/openamr-platform-sw/ros2/src/openamrobot_sil/COLCON_IGNORE
          ls src src/pins/platform-sil/ros2/src
          for d in src/openamr-upperbody-sw src/openamr-platform-sw src/pins/platform-sil src/upstream/*; do
            echo "$d $(git -C "$d" rev-parse HEAD)"
          done | tee ../pins.txt
          { echo '### Pins'; echo '```'; cat ../pins.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The vcan module is not in the runner's base kernel package; linux-modules-extra carries it. If it cannot be
      # installed or loaded, setup_vcan_all.sh says BLOCKED, the tests that need vcan report BLOCKED, and Result fails.
      - name: Virtual CAN interfaces
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" iproute2 can-utils || echo "linux-modules-extra-$(uname -r) could not be installed"
          sudo modprobe vcan || echo "modprobe vcan failed"
          sudo modprobe can_raw || echo "modprobe can_raw failed"
          set +e
          sh "$PACKAGE_DIR/scripts/setup_vcan_all.sh" 2>&1 | tee vcan.txt
          echo "VCAN_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          ip -details link show type vcan | tee -a vcan.txt
          { echo '### Virtual CAN'; echo '```'; cat vcan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # rosdep for the closure of the package. openamr-platform-sw names keys that rosdep does not know
      # (its own interface package lives in another repository), so unresolved keys are reported, not fatal.
      - name: rosdep
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy
          paths=$(colcon list --base-paths src --packages-up-to "$PACKAGE" openamr_nav_msgs --paths-only)
          echo "$paths"
          rosdep install --rosdistro jazzy --from-paths $paths --ignore-src -y -r
          sudo apt-get install -y python3-can ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-moveit ros-jazzy-joint-state-publisher ros-jazzy-launch-testing-ament-cmake ros-jazzy-ament-cmake-pytest

      - name: Package versions
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' \
            | grep -E '^(ros-jazzy-(ros-base|rclcpp|ros-gz|gz-|ros2-control|controller-manager|hardware-interface|joint-trajectory-controller|xacro|moveit|navigation2|nav2-bringup)|gz-|libgz-sim|linux-modules-extra|python3-can)' \
            | sort | tee versions.txt
          { echo '### Package versions'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: colcon build
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          set +e
          colcon build --continue-on-error --packages-up-to "$PACKAGE" openamr_nav_msgs --event-handlers console_cohesion+ 2>&1 | tee ../build.txt
          rc=${PIPESTATUS[0]}
          echo "=== ARCHBUILD SUMMARY $(dpkg --print-architecture) $(uname -m)"
          grep -E "^Summary:|^  [0-9]+ packages? (failed|aborted|had stderr|not processed)|^Failed   <<<|^Aborted  <<<|^Finished <<<" ../build.txt
          echo "=== ARCHBUILD END"
          echo "=== ELF"
          find install -type f \( -name '*.so*' -o -perm -u+x \) -exec file {} + 2>/dev/null | grep ELF | grep -o "ELF 64-bit LSB [a-z ]*, [A-Za-z0-9 _-]*" | sort | uniq -c
          echo "=== PREBUILT BINARIES IN src"
          find src -type f \( -name '*.so' -o -name '*.a' -o -name '*.whl' \) | head -20
          echo "=== END"
          exit $rc
