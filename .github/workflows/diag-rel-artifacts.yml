# SPDX-License-Identifier: MIT
# Scratch diagnosis (not for merge): reads recorded artifacts of earlier runs and prints evidence lines.
name: diag rel artifacts
on:
  push:
    branches: [diag/rel-artifacts]
permissions:
  contents: read
  actions: read
jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: "pip mcap readers, pass 2 joint snapshots"
        run: python3 -m pip install --user mcap==1.2.2 mcap-ros2-support==0.5.5
      - name: control room run 44476577635 (grasp_reach servo torque 1.018 N m)
        run: |
          gh run download 44476577635 -R ${{ github.repository }} -n control-room-e2e -D cr
          python3 .github/diag/arm.py cr -0.90234
      - name: acceptance leg 1 of 44470870769 (passing, 0.158 N m)
        run: |
          gh run download 44470870769 -R ${{ github.repository }} -n baseline1-acceptance-leg1-attempt1 -D l1
          python3 .github/diag/arm.py l1 -0.93651
