# SPDX-License-Identifier: MIT
# After the control room end-to-end run 44445938978: (1) its report, REPLAY screenshots and control room files to this
# log as a base64 tar.gz (artifact downloads are not reachable from the agent session), (2) a diagnosis of why the
# control room bag of that run has no /control_room/ messages: the control room launch with use_sim_time:=true next to a
# test /clock publisher (no Gazebo, no robot stack), recorded with the same recorder command as the run.
# No simulation of the robot, no hardware, no secrets beyond the job's read-only token.
name: Control room post-run

on:
  push:
    branches: [demo/control-room]
    paths:
      - '.github/workflows/control-room-postrun.yml'

permissions:
  contents: read
  actions: read

env:
  ROS_APT_SOURCE_VERSION: '1.3.0'
  E2E_RUN: '44445938978'

jobs:
  postrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: control-room-e2e
          run-id: ${{ env.E2E_RUN }}
          github-token: ${{ github.token }}
          path: e2e

      - name: Run files to this log (base64 tar.gz)
        run: |
          find e2e -maxdepth 2 | sort | head -80
          tar -czf postrun.tgz --exclude='e2e/cr/control_room_bag' -C e2e report cr
          ls -la postrun.tgz; sha256sum postrun.tgz
          echo "=====BEGIN POSTRUN FILES====="
          base64 -w 0 postrun.tgz; echo
          echo "=====END POSTRUN FILES====="

      - name: ROS 2 Jazzy and the control room package
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools ros-jazzy-nav2-msgs ros-jazzy-ros-gz-interfaces \
            ros-jazzy-rosbag2-py ros-jazzy-rosbag2-storage-mcap ros-jazzy-tf2-ros ros-jazzy-visualization-msgs python3-can python3-yaml
          cd ws && source /opt/ros/jazzy/setup.bash && colcon build --packages-select openamrobot_control_room

      - name: "Diagnosis: control room with use_sim_time and the run's recorder command"
        working-directory: ws
        run: |
          set +e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_DOMAIN_ID=93 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          dfl() { python3 -c 'import os,signal,sys; signal.signal(signal.SIGINT, signal.SIG_DFL); os.execvp(sys.argv[1], sys.argv[1:])' "$@"; }
          # A test /clock at 10x real time (not Gazebo): only so use_sim_time nodes have a clock.
          python3 - > ../clock.log 2>&1 <<'PY' &
          import time, rclpy
          from rosgraph_msgs.msg import Clock
          rclpy.init(); n = rclpy.create_node("test_clock"); p = n.create_publisher(Clock, "/clock", 10)
          t = 0.0
          while rclpy.ok():
              m = Clock(); m.clock.sec, m.clock.nanosec = int(t), int((t % 1) * 1e9); p.publish(m); t += 0.01; time.sleep(0.001)
          PY
          clock=$!
          dfl ros2 launch openamrobot_control_room control_room.launch.py rviz:=false foxglove:=false vcan:=true \
            use_sim_time:=true station:=work_shelf scene:=scene.yaml > ../cr_launch.log 2>&1 &
          launch=$!
          sleep 20
          for cmd in "--regex /control_room/.* --topics /robot_description /baseline1/mission_status /grocery_demo/phase" \
                     "--topics /control_room/status /control_room/can/summary /robot_description" \
                     "--regex /control_room/.*"; do
            name=$(echo "$cmd" | md5sum | cut -c1-6)
            echo "=== ros2 bag record --use-sim-time -s mcap $cmd"
            dfl ros2 bag record --use-sim-time -s mcap -o ../bag_$name $cmd > ../record_$name.log 2>&1 &
            rec=$!
            sleep 25
            kill -INT $rec; sleep 5
            ros2 bag info ../bag_$name 2>&1 | grep -E "Messages|Topic:" ; tail -5 ../record_$name.log
          done
          echo "=== ros2 topic list -v"; timeout 30 ros2 topic list -v --no-daemon
          echo "=== ros2 node info /control_room_monitor"; timeout 30 ros2 node info /control_room_monitor --no-daemon
          echo "=== ros2 topic hz /control_room/status (10 s)"; timeout 10 ros2 topic hz /control_room/status
          echo "=== one /control_room/status"; timeout 20 ros2 topic echo --once --full-length /control_room/status | head -c 6000
          kill -INT $launch $clock; sleep 3
          echo "=== control room launch log"; cat ../cr_launch.log | tail -40
