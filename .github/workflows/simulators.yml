# SPDX-License-Identifier: MIT
# MuJoCo and Isaac Sim representations of the combined model (issue #58): generated from the pinned gazebo expansion, never committed.
#   mujoco: expansion hash against the lock mirror, MJCF generation, structural parity, MuJoCo physics checks, arm comparison with
#           openarm_mujoco, the Isaac import job and the USD checker self-test (the CPU Isaac checks). Hosted runner, no GPU.
#           Without a GPU runner it also reports the Isaac USD import as BLOCKED (job summary and a warning annotation).
#   isaac:  the USD import needs Isaac Sim on a GPU. It runs only when the repository variable ISAAC_GPU_RUNNER names a GPU runner;
#           otherwise it is skipped, so pull requests are not red for a runner that does not exist. Skipped and BLOCKED are not PASS.
# Results are simulation evidence only: never hardware, physical acceptance or safety evidence. No secrets, no hardware.
name: Simulators

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PINS_FILE: src/openamr-upperbody-sw/ros2/src/openamrobot_upperbody_description/config/upstream_pins.yaml
  SIM_PINS_FILE: src/openamr-upperbody-sw/simulation/sim_pins.yaml
  OVERRIDES_FILE: src/openamr-upperbody-sw/ros2/src/openamrobot_upperbody_description/config/sim_dynamics/engine_overrides.yaml
  LOCK_FILE: src/openamr-upperbody-sw/simulation/expansion_lock.yaml

jobs:
  mujoco:
    name: mujoco (generation, parity, physics)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: simulators-mujoco-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ws
    steps:
      - run: mkdir -p ws
        working-directory: .

      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: jazzy

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Read the pins
        id: pins
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import os, re, yaml
          pins = yaml.safe_load(open(os.environ["PINS_FILE"]))["pins"]
          sim = yaml.safe_load(open(os.environ["SIM_PINS_FILE"]))
          ov = yaml.safe_load(open(os.environ["OVERRIDES_FILE"]))
          lock = yaml.safe_load(open(os.environ["LOCK_FILE"]))
          values = {"platform": pins["openamr_platform_sw"], "openarm_description": pins["openarm_description"],
                    "openarm_ros2": pins["openarm_ros2"], "openarm_mujoco": sim["openarm_mujoco"]["commit"],
                    "platform_friction": ov["sources"]["platform_sw_main"]["commit"]}
          for key, value in values.items():
              assert re.fullmatch(r"[0-9a-f]{40}", value), f"{key}: {value!r} is not a full hash"
              print(f"{key}={value}")
          xacro = {e["inputs"]["xacro_package_version"] for e in lock["entries"]}
          assert len(xacro) == 1, xacro
          print(f"xacro={xacro.pop()}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.platform }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ steps.pins.outputs.platform_friction }}
          path: ws/src/openamr-platform-sw-friction
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_ros2
          ref: ${{ steps.pins.outputs.openarm_ros2 }}
          path: ws/src/upstream/openarm_ros2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_mujoco
          ref: ${{ steps.pins.outputs.openarm_mujoco }}
          path: ws/src/upstream/openarm_mujoco
          persist-credentials: false

      # The lock's expansion hashes were computed with this xacro build. Another build is another input: the tests then report
      # NotLocked (BLOCKED), which fails the job instead of comparing unlike things.
      - name: xacro at the locked version, Python packages at their pins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "ros-jazzy-xacro=${{ steps.pins.outputs.xacro }}" \
            || sudo apt-get install -y --no-install-recommends ros-jazzy-xacro
          dpkg-query -W -f='${Package} ${Version}\n' ros-jazzy-xacro | tee versions.txt
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet -r src/openamr-upperbody-sw/simulation/requirements.txt
          .venv/bin/pip freeze | grep -i -E '^(mujoco|pin|usd-core|trimesh|pycollada|scipy|numpy|pyyaml|jsonschema|pytest)==' | tee -a versions.txt
          { echo '### Versions'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate MJCF and the Isaac import job (bp000, bp050)
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          .venv/bin/python src/openamr-upperbody-sw/simulation/tools/generate.py --isaac \
            --platform-sw src/openamr-platform-sw --openarm-description src/upstream/openarm_description --out build/sim \
            | tee generate.jsonl

      - name: Simulation tests
        env:
          OPENAMR_PLATFORM_SW: ${{ github.workspace }}/ws/src/openamr-platform-sw
          OPENAMR_PLATFORM_SW_MAIN: ${{ github.workspace }}/ws/src/openamr-platform-sw-friction
          OPENARM_DESCRIPTION: ${{ github.workspace }}/ws/src/upstream/openarm_description
          OPENARM_ROS2: ${{ github.workspace }}/ws/src/upstream/openarm_ros2
          OPENARM_MUJOCO: ${{ github.workspace }}/ws/src/upstream/openarm_mujoco
          SIM_EVIDENCE_DIR: ${{ github.workspace }}/ws/evidence
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          set +e
          .venv/bin/python -m pytest -p no:cacheprovider -rfE --junitxml=simulation-tests.xml src/openamr-upperbody-sw/simulation/tests
          echo "TESTS_RC=$?" >> "$GITHUB_ENV"

      - name: Test counts and the openarm_mujoco comparison
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("simulation-tests.xml").getroot()
          suites = root.iter("testsuite")
          t = {k: sum(int(s.get(k, 0)) for s in root.iter("testsuite")) for k in ("tests", "failures", "errors", "skipped")}
          blocked = sum(1 for c in root.iter("testcase") for f in list(c.findall("failure")) + list(c.findall("error"))
                        if "BLOCKED" in (f.get("message") or "") + (f.text or ""))
          line = (f"discovered {t['tests']}, skipped {t['skipped']}, executed {t['tests'] - t['skipped']}, "
                  f"failed {t['failures'] + t['errors']} (of which BLOCKED {blocked})")
          print(line)
          with open(sys.argv[1], "a") as out:
              out.write(f"### Simulation tests\n\n{line}\n\n")
          if t["tests"] - t["skipped"] == 0:
              sys.exit("no test executed")
          EOF
          .venv/bin/python src/openamr-upperbody-sw/simulation/tools/compare_openarm_mujoco.py \
            --model build/sim/bp000/openamrobot_bp000.xml --openarm-mujoco src/upstream/openarm_mujoco \
            --json evidence/openarm_mujoco_rows.json > compare.md || true
          { echo '### Arms against openarm_mujoco (differences)'; cat compare.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulators-mujoco
          path: |
            ws/build/sim/
            ws/evidence/
            ws/simulation-tests.xml
            ws/generate.jsonl
            ws/versions.txt
          if-no-files-found: warn

      - name: Isaac Sim USD import BLOCKED without a GPU runner
        if: always() && vars.ISAAC_GPU_RUNNER == ''
        run: |
          {
            echo '### Isaac Sim USD import: BLOCKED'
            echo
            echo 'No GPU runner (repository variable ISAAC_GPU_RUNNER is not set), so Isaac Sim did not import the model and the `isaac`'
            echo 'job is skipped. BLOCKED is not PASS. The CPU Isaac checks (import job, USD checker self-test) ran in this job.'
            echo 'On a machine with an NVIDIA GPU and the Isaac Sim 5.1.0 container, run the commands of docs/simulators.md, section Isaac Sim.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Isaac Sim USD import BLOCKED::No GPU runner (ISAAC_GPU_RUNNER unset); the isaac job is skipped. CPU Isaac checks ran in the mujoco job."

      - name: Result
        run: |
          echo "pytest exit status: $TESTS_RC"
          exit "$TESTS_RC"

  isaac:
    name: isaac (USD import, needs a GPU)
    # Runs only on the GPU runner named by the repository variable ISAAC_GPU_RUNNER. Without one it is skipped (the mujoco job reports
    # BLOCKED). A named runner without a GPU still fails below: that is a misconfigured runner, not a missing one.
    if: vars.ISAAC_GPU_RUNNER != ''
    runs-on: ${{ vars.ISAAC_GPU_RUNNER }}
    timeout-minutes: 90
    steps:
      - name: GPU
        id: gpu
        run: |
          if command -v nvidia-smi >/dev/null && nvidia-smi -L; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: BLOCKED, the named GPU runner has no GPU
        if: steps.gpu.outputs.present != 'true'
        run: |
          {
            echo '### Isaac Sim USD: BLOCKED'
            echo
            echo 'ISAAC_GPU_RUNNER names a runner without a GPU, so Isaac Sim cannot import the model. BLOCKED is not PASS.'
            echo 'On a machine with an NVIDIA GPU and the Isaac Sim 5.1.0 container, run the commands of docs/simulators.md, section Isaac Sim:'
            echo
            echo '```bash'
            echo 'python3 simulation/tools/generate.py --isaac --config bp000 --platform-sw <pin checkout> --openarm-description <pin checkout> --out build/sim'
            echo 'docker run --rm --gpus all -e ACCEPT_EULA=Y -e PRIVACY_CONSENT=Y -v "$PWD":/work -w /work --entrypoint /isaac-sim/python.sh nvcr.io/nvidia/isaac-sim:5.1.0 simulation/tools/isaac_generate_usd.py --job build/sim/bp000/isaac/isaac_job.json'
            echo 'python3 simulation/tools/check_usd.py --job build/sim/bp000/isaac/isaac_job.json --platform-sw <pin checkout> --openarm-description <pin checkout>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BLOCKED: the runner named by ISAAC_GPU_RUNNER has no GPU; Isaac Sim USD generation was not run"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gpu.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Generate, import and check the USD (GPU runner)
        if: steps.gpu.outputs.present == 'true'
        run: |
          echo "A GPU runner must provide ROS 2 Jazzy, xacro at the locked version, the pinned checkouts and the Isaac Sim 5.1.0 image."
          echo "The commands are those of docs/simulators.md, section Isaac Sim. This step has never run: no GPU runner exists yet."
          exit 1
