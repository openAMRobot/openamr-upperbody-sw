# SPDX-License-Identifier: MIT
# Control room end to end: one Baseline 1 mission (the steps of baseline1-acceptance.yml, profile sim-oracle, station
# approach 1, station alignment 1) with the Digital Twin Control Room running next to it in the mission's own ROS
# domain: the read-only monitor and the receive-only vcan monitor, their /control_room/ outputs recorded to a second
# bag, graph snapshots of the live stack, then the offline HTML report from the mission's bag, mission JSON and
# candump logs, and a headless REPLAY of the recording in RViz2 (Xvfb) with screenshots.
#
# Runs on a push that changes .github/control-room-e2e.trigger on demo/control-room (workflow_dispatch needs the file
# on the default branch). Editing this workflow alone starts nothing: each run is about 1.5 h of runner time.
# The control room holds no command authority: it publishes only under /control_room/. The Baseline 1 verdict is the
# mission's; this job does not change it and reports it as it is. Simulation evidence only: never hardware, physical
# acceptance or safety evidence. No secrets, no hardware.
name: Control room end to end

on:
  push:
    branches: [demo/control-room]
    paths:
      - '.github/control-room-e2e.trigger'

permissions:
  contents: read

env:
  PACKAGE: openamrobot_build1_scene
  PACKAGE_DIR: ws/src/openamr-upperbody-sw/ros2/src/openamrobot_build1_scene
  # openamr-platform-sw integration/baseline1: main 69847ab with #152, #146, #149, #151, #158, #164 (station
  # approach, AMCL 0.05 m / 0.05 rad, bt_navigator 30000 ms server wait, NOTICE at 194e208), #167 (station marker
  # alignment, Proposed), #162 (lift firmware-SIL path on the simulation clock) and #166 (#141 reconciled with the clock contract)
  # merged (docs/integration/baseline1.md). Description, Nav2, perception, docking and openamrobot_sil come from it.
  PLATFORM_SW_SHA: 931e631db661b16d1057dfd1ab1d13ea606482e2
  # ros-infrastructure/ros-apt-source release, pinned: ros-tooling/setup-ros looks the latest tag up through the
  # unauthenticated GitHub API, which returned no tag on 17 Nov 2026 (rate limit) and made the download 404.
  ROS_APT_SOURCE_VERSION: '1.3.0'
  BASELINE1_STATION_APPROACH: '1'
  # Station alignment on, as in the acceptance runs that passed (44309791416, 44309804809, 44309817813, 44448676604).
  # Without it run 44445938978 stopped 0.0449 m from the station and the straight reach ended with the elbow straight
  # (grasp_reach_cartesian_fraction 0.6508; test_reach_margin.py).
  BASELINE1_STATION_ALIGNMENT: '1'
  # CycloneDDS with the participant index cap raised to 120, as baseline1-acceptance.yml on integration/baseline1
  # (Alex, 19 Nov 2026; DDS benchmark #89). With the alignment nodes and the control room on Fast DDS under
  # ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST, run 44466371978 never matched the joint_state_broadcaster spawner with
  # /controller_manager (180 s, "Could not contact service /controller_manager/list_controllers"): the index cap of
  # docs/integration/dds_benchmark.md (#89).
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><Discovery><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>'
  # Acceptance profile (Alex, 18 Nov 2026). sim-oracle sets the planning scene from simulator ground truth and every run
  # declares it; perception uses the robot's own estimate. A sim-oracle pass is never a perception result.
  BASELINE1_PROFILE: sim-oracle
  BUILD1_PLANNING_POSE_SOURCE: ground_truth
  # The scene's launch calls sil.launch.py's can_nodes(config, stm32, gazebo, renode) and default_renode_args() (#141);
  # #166 carries that API on the clock contract, so the #145 pin (config/pins.yaml platform_sw_pr145) is not built here.
  # #144/#145 (transmit audit, pty relay) are not in the platform integration branch.
  # Gazebo vendor builds as re-pinned by openamr-platform-sw #152 (16 Nov 2026), checked against gz-sim 8.15.0.
  GZ_SIM_VENDOR: 0.0.13-1noble.20261031.125555
  GZ_TOOLS_VENDOR: 0.0.8-1noble.20261025.230735
  SDFORMAT_VENDOR: 0.0.14-1noble.20261031.120928
  GZ_SIM_VERSION: 8.15.0
  SDFORMAT_VERSION: 14.9.0
  # Deterministic start: Python random (and the ROS domain of the test), hash seed, simulation time everywhere.
  BASELINE1_SEED: '20261117'
  PYTHONHASHSEED: '20261117'

jobs:
  e2e:
    name: Baseline 1 mission with the control room
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - name: "ENV/INFRA: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source, no GitHub API lookup)"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools ffmpeg
          sudo rosdep init || echo "rosdep init: already initialized"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ws/src/openamr-upperbody-sw
          persist-credentials: false

      - name: Read the pins
        id: pins
        run: |
          python3 - "$PACKAGE_DIR/config/pins.yaml" >> "$GITHUB_OUTPUT" <<'EOF'
          import re, sys, yaml
          pins = yaml.safe_load(open(sys.argv[1]))["pins"]
          for key in ("platform_sw_pr145", "openarm_ros2", "openarm_can", "openarm_description"):
              value = pins[key]["sha"]
              assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), f"{key}: {value!r} is not a full hash"
              print(f"{key}={value}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamr-platform-sw
          ref: ${{ env.PLATFORM_SW_SHA }}
          path: ws/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_description
          ref: ${{ steps.pins.outputs.openarm_description }}
          path: ws/src/upstream/openarm_description
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_ros2
          ref: ${{ steps.pins.outputs.openarm_ros2 }}
          path: ws/src/upstream/openarm_ros2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enactic/openarm_can
          ref: ${{ steps.pins.outputs.openarm_can }}
          path: ws/src/upstream/openarm_can
          persist-credentials: false

      - name: Workspace layout and pins
        working-directory: ws
        run: |
          # openamrobot_sil is the platform integration branch's (clock contract, #162 lift path, #166 launch API),
          # no longer the #145 pin.
          for d in src/openamr-upperbody-sw src/openamr-platform-sw src/upstream/*; do
            echo "$d $(git -C "$d" rev-parse HEAD)"
          done | tee ../pins.txt
          echo "wheel_radius in the built openamrobot_sil:"; grep -n wheel_radius src/openamr-platform-sw/ros2/src/openamrobot_sil/config/sil.yaml || true
          echo "wheel_radius in the integration description:"; grep -rn 'wheel_radius' src/openamr-platform-sw/ros2/src/openamrobot_description/urdf/*.xacro | head -5 || true
          { echo '### Pins'; echo '```'; cat ../pins.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "ENV/INFRA: virtual CAN"
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y iproute2 can-utils
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "linux-modules-extra-$(uname -r) could not be installed"
          sudo modprobe vcan || echo "modprobe vcan failed"
          sudo modprobe can_raw || echo "modprobe can_raw failed"
          set +e
          sh "$PACKAGE_DIR/scripts/setup_vcan_all.sh" 2>&1 | tee vcan.txt
          rc=${PIPESTATUS[0]}
          echo "VCAN_RC=$rc" >> "$GITHUB_ENV"
          ip -details link show type vcan | tee -a vcan.txt
          [ "$rc" = "0" ] || echo "ENV_REASON=setup_vcan_all.sh exit $rc: virtual CAN unavailable on this runner" >> "$GITHUB_ENV"

      - name: "ENV/INFRA: pinned Gazebo vendor builds (as openamr-platform-sw #152)"
        id: gazebo
        run: |
          sudo apt-get install -y --allow-downgrades \
            ros-jazzy-gz-sim-vendor=${GZ_SIM_VENDOR} \
            ros-jazzy-gz-tools-vendor=${GZ_TOOLS_VENDOR} \
            ros-jazzy-sdformat-vendor=${SDFORMAT_VENDOR}
          sudo apt-mark hold ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor

      - name: "ENV/INFRA: rosdep and the stack"
        id: deps
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update --rosdistro jazzy
          # The #167 extension package is built only for the opt-in alignment run (station_alignment 1).
          extra=""; [ "${BASELINE1_STATION_ALIGNMENT}" = "1" ] && extra="openamrobot_station_alignment"
          paths=$(colcon list --base-paths src --packages-up-to "$PACKAGE" openamrobot_control_room $extra --paths-only)
          rosdep install --rosdistro jazzy --from-paths $paths --ignore-src -y -r
          sudo apt-get install -y python3-can ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-moveit ros-jazzy-joint-state-publisher ros-jazzy-launch-testing-ament-cmake ros-jazzy-ament-cmake-pytest
          # ros-jazzy-rmw-cyclonedds-cpp from packages.ros.org (Eclipse Cyclone DDS: EPL-2.0 / EDL-1.0; rmw_cyclonedds:
          # Apache-2.0), as baseline1-acceptance.yml and the DDS benchmark workflow (#89).
          sudo apt-get install -y ros-jazzy-rmw-cyclonedds-cpp
          dpkg -s ros-jazzy-rmw-cyclonedds-cpp > /dev/null || { echo "ENV/INFRA: rmw_cyclonedds_cpp missing"; exit 1; }

      - name: "ENV/INFRA: check the pinned versions"
        id: versions
        run: |
          source /opt/ros/jazzy/setup.bash
          sim=$(gz sim --versions); sdf=$(gz sdf --versions)
          echo "gz sim ${sim}, gz sdf ${sdf}"
          dpkg-query -W -f='${Package} ${Version}\n' \
            | grep -E '^(ros-jazzy-(ros-base|rclcpp|ros-gz|gz-|ros2-control|controller-manager|hardware-interface|joint-trajectory-controller|xacro|moveit|navigation2|nav2-bringup)|python3-can)' \
            | sort | tee versions.txt
          { echo '### Package versions'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "${sim}" = "${GZ_SIM_VERSION}" || { echo "ENV/INFRA: expected gz-sim ${GZ_SIM_VERSION}, found ${sim}"; exit 1; }
          test "${sdf}" = "${SDFORMAT_VERSION}" || { echo "ENV/INFRA: expected sdformat ${SDFORMAT_VERSION}, found ${sdf}"; exit 1; }

      - name: "BUILD: colcon build"
        id: build
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          extra=""; [ "${BASELINE1_STATION_ALIGNMENT}" = "1" ] && extra="openamrobot_station_alignment"
          colcon build --packages-up-to "$PACKAGE" openamrobot_control_room $extra --event-handlers console_cohesion+

      - name: "ENV/INFRA: rosbridge_server for the read-only operator view probe"
        run: |
          sudo apt-get install -y ros-jazzy-rosbridge-server python3-websockets
          dpkg-query -W -f='${Package} ${Version}\n' ros-jazzy-rosbridge-server ros-jazzy-rosbridge-library python3-websockets | tee -a versions.txt
          # A second, restricted bridge instance for a read-only operator view (openamrobot-ui #61): no publish, no
          # service, no action, and only the status topics. Quoted, so the globs stay strings (rosbridge parses them).
          mkdir -p cr
          cat > cr/rosbridge_readonly.yaml <<'YAML'
          rosbridge_readonly:
            ros__parameters:
              port: 9091
              address: "127.0.0.1"
              topics_pub_glob: "[]"
              services_glob: "[]"
              actions_glob: "[]"
              topics_sub_glob: "['/navigation/status', '/baseline1/mission_status', '/grocery_demo/phase', '/sil/bms/battery_state', '/diagnostics', '/safety/stop_lock', '/battery_status', '/control_room/status']"
          YAML
          cat cr/rosbridge_readonly.yaml

      - name: "Mission with the control room next to it"
        id: mission
        if: steps.build.outcome == 'success' && env.VCAN_RC == '0'
        working-directory: ws
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export BUILD1_LOG_DIR="$PWD/build1_logs"
          mkdir -p "$BUILD1_LOG_DIR" ../cr
          echo "nproc $(nproc)"
          # The control room joins the mission's ROS domain. build1_harness.py picks it at random and writes it into
          # GZ_PARTITION=build1_<domain>_<pid>; it is read from the environment of the running processes, not guessed.
          (
            set +e
            for i in $(seq 1 600); do
              domain=$(for p in /proc/[0-9]*; do tr '\0' '\n' < "$p/environ" 2>/dev/null | sed -n 's/^GZ_PARTITION=build1_\([0-9]*\)_.*/\1/p'; done | sort -u | head -1)
              [ -n "$domain" ] && break
              sleep 2
            done
            echo "control room: mission ROS domain '${domain}' (from GZ_PARTITION, after ${i} polls)" | tee ../cr/domain.txt
            [ -n "$domain" ] || exit 0
            export ROS_DOMAIN_ID="$domain" ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
            # SIGINT is ignored by background jobs of a non-interactive shell; restore it so the recorders stop cleanly.
            dfl() { python3 -c 'import os,signal,sys; signal.signal(signal.SIGINT, signal.SIG_DFL); os.execvp(sys.argv[1], sys.argv[1:])' "$@"; }
            dfl ros2 launch openamrobot_control_room control_room.launch.py rviz:=false foxglove:=false vcan:=true \
              use_sim_time:=true station:=work_shelf scene:=scene.yaml status_log:="$PWD/../cr/status.jsonl" \
              can_log:="$PWD/../cr/can.jsonl" > ../cr/control_room.log 2>&1 &
            echo $! > ../cr/launch.pid
            sleep 20
            dfl ros2 bag record --use-sim-time -s mcap -o ../cr/control_room_bag --regex '/control_room/.*' \
              --topics /robot_description /baseline1/mission_status /grocery_demo/phase > ../cr/record.log 2>&1 &
            echo $! > ../cr/record.pid
            dfl ros2 run rosbridge_server rosbridge_websocket --ros-args -r __node:=rosbridge_readonly \
              --params-file ../cr/rosbridge_readonly.yaml > ../cr/rosbridge.log 2>&1 &
            echo $! > ../cr/rosbridge.pid
            # Graph snapshots of the live stack, 2, 5 and 8 minutes after the domain appeared (run 44445938978: the
            # whole mission took 8 minutes at a real-time factor of about 0.2).
            for at in 120 300 480; do
              sleep $(( at - ${prev:-0} )); prev=$at
              out="../cr/graph_${at}s.txt"
              {
                echo "### graph at ${at} s after the domain appeared"
                timeout 60 ros2 topic list -t --no-daemon
                for t in /cmd_vel /cmd_vel_nav /cmd_vel_smoothed /sil/drive/status /sil/drive/emulator_state /sil/lift/status \
                         /sil/lift/emulator_state /sil/fw/status /baseline1/mission_status /navigation/status /safety/stop_lock \
                         /battery_status /diagnostics; do
                  echo "== ros2 topic info -v $t"; timeout 30 ros2 topic info -v "$t" --no-daemon 2>&1 | head -40
                done
                echo "== ros2 node info /control_room_monitor"; timeout 30 ros2 node info /control_room_monitor --no-daemon 2>&1
                echo "== /control_room/status (one message)"; timeout 30 ros2 topic echo --once --full-length /control_room/status 2>&1 | head -c 20000
                echo; echo "== /control_room/can/decoded (one message)"; timeout 30 ros2 topic echo --once --full-length /control_room/can/decoded 2>&1 | head -c 30000
                echo; echo "== /sil/drive/emulator_state (one message, 20 s)"; timeout 20 ros2 topic echo --once /sil/drive/emulator_state 2>&1 | head -c 3000
                if [ "$at" = "300" ]; then
                  echo; echo "== read-only rosbridge probe (ws://127.0.0.1:9091, 40 s of subscriptions, then write attempts)"
                  timeout 120 python3 -P src/openamr-upperbody-sw/ros2/src/openamrobot_control_room/tools/rosbridge_readonly_probe.py ws://127.0.0.1:9091 40
                  echo "== after the probe: publishers of /control_room/rosbridge_probe (must be none)"
                  timeout 30 ros2 topic info -v /control_room/rosbridge_probe --no-daemon 2>&1
                  echo "== ros2 node info /rosbridge_readonly"; timeout 30 ros2 node info /rosbridge_readonly --no-daemon 2>&1
                  echo "== publishers of /cmd_vel after the probe"; timeout 30 ros2 topic info -v /cmd_vel --no-daemon 2>&1 | head -30
                fi
              } > "$out" 2>&1
            done
          ) &
          echo $! > ../cr/watcher.pid
          set +e
          colcon test --packages-select "$PACKAGE" --event-handlers console_direct+ --return-code-on-test-failure \
            --ctest-args -R '^test_baseline1_mission$'
          echo "MISSION_RC=$?" >> "$GITHUB_ENV"
          colcon test-result --test-result-base "build/$PACKAGE" --verbose
          for f in record launch rosbridge; do [ -f "../cr/$f.pid" ] && kill -INT "$(cat ../cr/$f.pid)" 2>/dev/null; done
          sleep 10
          pkill -INT -f "ros2 bag record --use-sim-time -s mcap -o ../cr/control_room_bag" || true
          pkill -TERM -f control_room_monitor.py || true; pkill -TERM -f vcan_monitor.py || true
          kill "$(cat ../cr/watcher.pid)" 2>/dev/null || true
          sleep 5
          cat ../cr/domain.txt || echo "control room: no domain file"
          ls -la ../cr ../cr/control_room_bag 2>/dev/null

      - name: Phase table (the mission's verdict, unchanged)
        if: always()
        run: |
          set +e
          python3 "$PACKAGE_DIR/scripts/baseline1_report.py" ws/build1_logs --build-ok 1 --env-ok "$([ "${VCAN_RC:-1}" = 0 ] && echo 1 || echo 0)" \
            --env-reason "${ENV_REASON:-}" --summary "$GITHUB_STEP_SUMMARY"
          echo "REPORT_RC=$?" >> "$GITHUB_ENV"

      - name: What the control room saw (graph snapshots and its own recording)
        if: always()
        working-directory: ws
        run: |
          set +e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          for f in ../cr/graph_*.txt; do [ -f "$f" ] && { echo "=================== $f"; cat "$f"; }; done
          echo "=================== control room launch log (tail)"; tail -60 ../cr/control_room.log
          echo "=================== rosbridge_readonly log (tail)"; tail -40 ../cr/rosbridge.log
          echo "=================== control room bag"; ros2 bag info ../cr/control_room_bag 2>&1 | tee ../cr/control_room_bag_info.txt
          echo "=================== control room JSON lines: $(wc -l < ../cr/status.jsonl 2>/dev/null) status, $(wc -l < ../cr/can.jsonl 2>/dev/null) CAN"
          python3 -P - ../cr/status.jsonl ../cr/can.jsonl <<'PY' 2>&1 | tee ../cr/control_room_jsonl_summary.txt
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1])] if __import__("os").path.exists(sys.argv[1]) else []
          can = [json.loads(l) for l in open(sys.argv[2])] if __import__("os").path.exists(sys.argv[2]) else []
          print("status lines", len(rows), "sim_time", rows[0].get("sim_time") if rows else None, "to", rows[-1].get("sim_time") if rows else None)
          print("mission sources", sorted({r["mission"]["source"] for r in rows}))
          for key in ("provenance", "mission", "drive", "lift", "bms", "firmware", "station", "localization", "scene"):
              print("last", key, json.dumps(rows[-1].get(key), sort_keys=True)[:1500] if rows else None)
          if can:
              print("last CAN summary", json.dumps(can[-1]["summary"], sort_keys=True)[:2000])
              for bus, values in sorted(can[-1]["decoded"]["decoded"].items()):
                  print("==", bus, len(values), "signals")
                  for name, value in sorted(values.items())[:30]:
                      print("  ", name, json.dumps(value, sort_keys=True)[:300])
          PY
          python3 -P - ../cr/control_room_bag <<'PY' 2>&1 | tee ../cr/control_room_summary.txt
          import collections, json, sys
          sys.path.insert(0, "src/openamr-upperbody-sw/ros2/src/openamrobot_control_room")
          from openamrobot_control_room import bag
          statuses, decoded, mission = [], [], []
          for topic, msg, t_ns in bag.read(sys.argv[1]):
              if topic == "/control_room/status":
                  statuses.append(json.loads(msg.data))
              elif topic == "/control_room/can/decoded":
                  decoded.append(json.loads(msg.data))
              elif topic == "/baseline1/mission_status":
                  mission.append((t_ns * 1e-9, json.loads(msg.data)))
          print(f"/control_room/status messages: {len(statuses)}, /control_room/can/decoded: {len(decoded)}, "
                f"/baseline1/mission_status: {len(mission)}")
          sims = [s["sim_time"] for s in statuses if s.get("sim_time") is not None]
          print("status sim_time span:", (min(sims), max(sims)) if sims else "none")
          print("mission sources seen:", sorted({s["mission"]["source"] for s in statuses}))
          print("phases seen on /baseline1/mission_status:", [(round(t, 2), m["phase"], m["state"]) for t, m in mission])
          for key in ("provenance", "drive", "lift", "bms", "firmware", "station", "localization", "scene"):
              print(f"last status {key}:", json.dumps(statuses[-1].get(key), sort_keys=True)[:1500] if statuses else "none")
          keys = collections.Counter(k for d in decoded for bus in d["decoded"].values() for k in bus)
          print("decoded signals:", len(keys))
          if decoded:
              last = decoded[-1]
              for bus, values in sorted(last["decoded"].items()):
                  print(f"== {bus}: {len(values)} signals")
                  for name, value in sorted(values.items())[:40]:
                      print(f"   {name}: {json.dumps(value, sort_keys=True)[:300]}")
          PY

      - name: Offline HTML report from the run
        if: always()
        working-directory: ws
        run: |
          set +e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          mkdir -p ../report
          ros2 run openamrobot_control_room mission_report.py --bag build1_logs/bag --mission build1_logs/baseline1_mission.json \
            --candump 'build1_logs/record_candump_*.log' --title "Baseline 1 mission report (run ${{ github.run_id }})" \
            -o ../report/control_room_report.html
          echo "REPORT_HTML_RC=$?" >> "$GITHUB_ENV"
          ls -la ../report

      - name: REPLAY in RViz2, headless, with screenshots
        if: always()
        working-directory: ws
        run: |
          set +e
          sudo apt-get install -y xvfb imagemagick mesa-utils > /dev/null
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_DOMAIN_ID=91 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1600x1000x24 > ../report/xvfb.log 2>&1 &
          sleep 3
          start=$(python3 -c "import json; m=json.load(open('build1_logs/baseline1_mission.json')); print(next((p['sim_start'] for p in m['phases'] if p['phase']=='nav_to_station' and p.get('sim_start') is not None), 0))")
          echo "replay from simulation second $start"
          timeout -s TERM 400 python3 -c 'import os,signal,sys; signal.signal(signal.SIGINT, signal.SIG_DFL); os.execvp(sys.argv[1], sys.argv[1:])' \
            ros2 launch openamrobot_control_room replay.launch.py bag:=build1_logs/bag,../cr/control_room_bag \
            mission:=build1_logs/baseline1_mission.json rate:=1.0 start:="$start" hold:=60 > ../report/replay.log 2>&1 &
          pid=$!
          for shot in 45 90 150; do
            sleep $(( shot - ${last:-0} )); last=$shot
            import -window root "../report/replay_${shot}s.png" && echo "screenshot replay_${shot}s.png"
            timeout 10 ros2 topic echo --once --full-length /control_room/replay/status 2>&1 | head -c 2000 > "../report/replay_status_${shot}s.txt"
            head -c 600 "../report/replay_status_${shot}s.txt"; echo
          done
          kill -INT $pid 2>/dev/null; sleep 5; kill -TERM $pid 2>/dev/null
          tail -40 ../report/replay.log
          ls -la ../report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: control-room-e2e
          retention-days: 30
          path: |
            ws/build1_logs/
            cr/
            report/
            vcan.txt
            versions.txt
            pins.txt
          if-no-files-found: warn

      - name: Result
        if: always()
        run: |
          echo "Baseline 1 mission verdict (baseline1_report.py exit): ${REPORT_RC:-not run} (0: all eight phases passed)"
          echo "control room report: exit ${REPORT_HTML_RC:-not run}"
          [ "${REPORT_HTML_RC:-1}" = "0" ]
