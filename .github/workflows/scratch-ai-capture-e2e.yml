# SPDX-License-Identifier: MIT
# Scratch (not for merge): timestamp measurement and end-to-end conversion of the recorded AI capture run
# 44448676604 with the embodied-ai converter. Read only, no hardware, no secrets. Simulation evidence only.
name: Scratch AI capture e2e

on:
  push:
    branches: [scratch/ai-capture-e2e]

permissions:
  contents: read
  actions: read

env:
  RUN_ID: '44448676604'
  ARTIFACT: baseline1-acceptance-attempt1
  ROSBAGS_VERSION: '0.11.9'

jobs:
  measure:
    name: Timestamps of run 44448676604
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: run-artifact
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install "rosbags==${ROSBAGS_VERSION}" pyyaml
      - name: Measure
        run: |
          set -e
          ls -la run-artifact/ws/build1_logs/bag
          mkdir -p out
          python3 tools/scratch/measure_stamps.py run-artifact/ws/build1_logs/bag --out out/stamps.json | tee out/stamps.txt
          echo '=== STAMPS JSON'; python3 -c 'import json;print(json.dumps(json.load(open("out/stamps.json"))))'
          echo '=== EXCERPTS JSON'; python3 -c 'import json;print(json.dumps(json.load(open("out/excerpts.json"))))'
          echo '=== END'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stamps-${{ env.RUN_ID }}
          path: out/
          retention-days: 30

  convert:
    name: Convert run 44448676604 with the embodied-ai converter branch
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # openAMRobot/openamrobot-embodied-ai ai/capture-timestamp-rule (draft into satya/capture-conversion-benchmark)
      EMBODIED_AI_SHA: 113888290a0c3f61815f9acbda342e43acfb32cd
      # C9 assets the converter pins, and the Proposed C9 component profile (interfaces #39 head)
      C9_SHA: 87ab8a936c97ab55ee74b8988ca3d7659160ea6a
      C9_COMPONENTS_SHA: 43ec67747b1087163f3b220fbcf3ee44eb31c2e5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamrobot-embodied-ai
          ref: ${{ env.EMBODIED_AI_SHA }}
          path: external/openamrobot-embodied-ai
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamrobot-interfaces
          ref: ${{ env.C9_SHA }}
          path: external/openamrobot-embodied-ai/external/openamrobot-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openAMRobot/openamrobot-interfaces
          ref: ${{ env.C9_COMPONENTS_SHA }}
          path: external/c9-components
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: run-artifact
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the converter at the branch head with its own pins (LeRobot 0.6.1, rosbags 0.11.9)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e 'external/openamrobot-embodied-ai/python[conversion,native,training]'
          python - <<'PY'
          import importlib.metadata as m
          for p in ("lerobot", "rosbags", "torch", "pyarrow", "av", "opencv-python-headless"):
              try:
                  print(p, m.version(p))
              except m.PackageNotFoundError:
                  print(p, "not installed")
          PY
      - name: Convert and load
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/scratch/e2e_convert.py --bag run-artifact/ws/build1_logs/bag \
            --profile external/openamrobot-embodied-ai/configs/capture_profiles/proposed/openamrobot-baseline1-gazebo-sim-oracle-v1.json \
            --contract external/c9-components/profiles/c9/mobile-lift-qpos-v1-proposed.json \
            --template external/openamrobot-embodied-ai/external/openamrobot-interfaces/schemas/yaml/c9-lerobot-dataset-valid.yaml \
            --out out 2>&1 | tee out/e2e.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ env.RUN_ID }}
          path: |
            out/*.json
            out/e2e.log
          retention-days: 30
