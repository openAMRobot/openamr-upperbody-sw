# SPDX-License-Identifier: MIT
# Electrical and thermal parameters of the emulated OpenArm 2.0 motors. Data only: the emulator's defaults are in
# src/arm_emulator.cpp (default_arm_motors) and include/openamrobot_openarm_emulator/motor_model.hpp, and
# test/test_package_static.py checks that the two agree. Simulation input, not hardware evidence.
#
# Every entry: value, unit, source, confidence, uncertainty, hardware_revision, owner, test, last_verified,
# measurement_item. confidence uses the audit vocabulary (openAMRobot/audits, digital-twin/phase1/CONVENTIONS.md):
# measured | manufacturer_document | cad | design_decision | estimate | unknown. An unknown value is null and names the
# measurement plan item (MP-06 arm joint dynamics, MP-07 arm bus and configuration, MP-08 arm fault and power).
# last_verified is the date the source was read; nothing here is measured.
schema_version: 1
status: Proposed
sources:
  datasheet_dm4310: "enactic/openarm@e15e09e website/static/file/hardware/specification/motor/dm4310.pdf (Damiao DM-J4310-2EC V1.1 manual V1.0, 2023-11-16), page 9; mirror https://aifitlab-wiki.super.site/damiao-docs/dm-j4310-2ec-v11-motor-instruction-manual"
  datasheet_dm4340: "enactic/openarm@e15e09e website/static/file/hardware/specification/motor/dm4340.pdf (Damiao DM-J4340-2EC manual), page 9"
  datasheet_dm8009: "enactic/openarm@e15e09e website/static/file/hardware/specification/motor/dm8009.pdf (Damiao DM-J8009-2EC manual; upstream says the fitted DM8009P is nearly identical), page 8"
  openarm_motor_table: "enactic/openarm@e15e09e website/docs/hardware/openarm-2.0/motor.mdx"
  register_table: "python-damiao-driver register table, https://python-damiao-driver.pages.dev/concept/registers (third party, not a Damiao document)"
  openarm_can: "enactic/openarm_can@bfd4e52 (1.4.1) src/openarm/damiao_motor/dm_motor_control.cpp#L100-L114"

