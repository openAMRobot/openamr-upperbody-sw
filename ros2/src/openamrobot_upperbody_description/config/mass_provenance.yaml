# SPDX-License-Identifier: MIT
# Where each mass group's figure really comes from (DATUMS.md, "Mass reporting", decided 6 Oct; built in P10).
#
# T10 reports the modelled mass over six groups (four until the P-03 item 24 equipment, 1 Nov 2026). The base and arm masses are not datums (they are not ours to declare:
# ADR-005, ADR-008), so datums.yaml's status field cannot say what they are; this map does, over all four groups, in three
# states and no others:
#
#   placeholder       no source: a number chosen so the model would expand (or no mass modelled at all)
#   external_nominal  a real figure from another owner's model, not verified by us (the base CAD export, the upstream arm
#                     nominals). Most of this robot's modelled mass is in this state; a two-state scheme cannot express it
#   verified          measured, with a document: `document` is required, and names it
#
# T10 prints "per-link masses still placeholders" whenever any group is `placeholder`, and a separate line naming the
# `external_nominal` groups. The map must agree with datums.yaml where a group draws its mass from a datum (the lift, from
# `lift_mass_dold_v4_350`): test_t10_mass_provenance checks it, so a datum that reaches `verified` cannot leave the map behind.
# A group is `verified` only here and only with a document; nothing infers it.
#
# Ledger values (P-03 rev20.6 item 30 A6, D-26): the lift, sensors and equipment groups read the pinned roadmap mass export, which is
# built from the openamrobot-docs mass ledger. Those are LEDGER VALUES (datasheet masses and design-intent estimates), NOT MEASURED
# VALUES: none of them is `verified` until the as-built robot is weighed and the weighing record is named as `document`.
# test_t10_mass_report.py checks that every group reading the export says "ledger value" and "not measured".
schema_version: 1
groups:
  base:
    state: external_nominal
    source: "platform-sw's CAD export: the inertials of openamrobot_description's urdf, included unchanged"
    owner: platform-sw
    note: "Not verified by us, and not a datum (ADR-005: the base is platform-sw's). W01: KDL drops base_link's own inertia."
  lift:
    state: external_nominal
    source: "roadmap model export (config/roadmap_mass_export.yaml, groups lift and lift_carriage; owner decision 8 Nov 2026, P-03 rev20.5 item 29 and rev20.6 item 30 A6): the DOLD Hexalift V4 350 catalogue 11.7 kg (datum lift_mass_dold_v4_350) split from the supplier STEP geometry and the materials into a static share on lift_column_base_link (outer profile, foot, drive) and a moving share on lift_carriage_link (inner profile, top cap, push tube), each with box inertias"
    owner: "Alex (F2S) for the figure; A6 (this repo) for the box"
    datum: lift_mass_dold_v4_350
    note: "Ledger value, not measured (P-03 rev20.6 item 30 A6). The 11.7 kg is a supplier catalogue figure, not weighed here; the static and moving split is an estimate from dimensions and material (openamrobot-docs facts.yaml column.mass_split), not the supplier's distribution. lift_column_base_link also carries the stop sensors and brackets and the lift node; lift_carriage_link carries the adapter plate, arm profile, Getac mount, second E-stop, flag rod and flag. Every part once (mass_ledger.yaml). Design values, not weighed. With column tl3_400 the datum box applies (the export is the DOLD build)."
  openarm:
    state: external_nominal
    source: "upstream openarm_description's nominal link masses at the pinned commit (config/upstream_pins.yaml); arms and grippers, no body (ADR-008)"
    owner: "upstream:openarm_description"
    note: "A vendor nominal, not verified by us and not a measurement of the arms we will buy."
  sensors:
    state: external_nominal
    source: "roadmap model export: head_camera_link carries the ZED Mini (datum head_camera_mass, 0.0629 kg, Stereolabs datasheet) and its supplied mount ARM-011 (estimate); each wrist camera link carries its camera (ARM-004, estimate)"
    owner: "A6 (this repo)"
    note: "Ledger value, not measured (P-03 rev20.6 item 30 A6). Supplier nominal and estimates, not weighed here."
  equipment:
    state: external_nominal
    source: "roadmap model export: getac_tablet_link (Getac ZX80, 0.590 kg) and head_light_link (Falcon FLDL-i150x15-W, at most 0.110 kg), supplier figures at the roadmap positions; the fixed portrait mount UI-002 rides the carriage"
    owner: "Alex (P-03 item 24) for the figures; A6 (this repo) for the boxes"
    note: "Ledger value, not measured (P-03 rev20.6 item 30 A6). Another owner's figures, not weighed here; the head light figure is an upper bound. The tablet's dock and mount are not modelled."
  equipment_no_mass:
    state: placeholder
    source: none
    owner: "A6 (this repo)"
    note: "These frames carry no <inertial>; their parts are counted once on the link they are fixed to (roadmap export): second_estop_link, lift_flag_rod_link, lift_flag_link on lift_carriage_link; lift_stop_sensor_l1000_link, lift_stop_sensor_l1175_link, lift_stop_sensor_l1350_link (sensors and brackets) on lift_column_base_link; head_camera_bracket_link on head_camera_link. lift_base_plate_link (MEC-019, P-03 rev20.6 item 30 A3) carries none either: the ledger puts its 1.293 kg on base_link (platform-sw reads that export)."
