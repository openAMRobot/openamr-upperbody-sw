# Derived, Apache-2.0. Modified by OpenAMRobot: only `robot.root_frame` and
# `primary_arm.connection.parent`, both now `lift_carriage_link`, option B's carriage (ADR-008, P15).
# Everything else is verbatim upstream, including the zero `connection.origin`: combined_robot.xacro
# sets the mount pose from option B's own config (geometry.arm_mount), so that there is one source.

robot:
  root_frame: lift_carriage_link
  components:
    - primary_arm
    - primary_arm_end_effector

body:
  type: robot
  enabled: false
  product: openarm_v2.0
  config: body
  inertials: nominal
  link_name: openarm_body_link0
  connection:
    parent: world
    origin:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  reflect:
    x: 1
    y: 1
    z: 1
  limit_override_joints: {}

primary_arm:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_right_
  connection:
    parent: lift_carriage_link
    origin:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  reflect:
    x: 1
    y: 1
    z: 1
  limit_override_joints: {}

secondary_arm:
  type: robot
  enabled: false
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_left_
  connection:
    parent: world
    origin:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  reflect:
    x: 1
    y: -1
    z: 1
  limit_override_joints: {}

primary_arm_end_effector:
  type: end_effector
  enabled: true
  product: pinch_gripper
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: primary_arm
    parent_reference_point: ee_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: 1
    z: 1
  limit_override_joints: {}

secondary_arm_end_effector:
  type: end_effector
  enabled: false
  product: pinch_gripper
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: secondary_arm
    parent_reference_point: ee_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: -1
    z: 1
  limit_override_joints: {}
