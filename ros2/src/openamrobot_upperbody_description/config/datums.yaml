# SPDX-License-Identifier: MIT
# datums.yaml - every number the combined description uses that is not upstream-owned (ADR-002).
# Schema v1, see 10_architecture/DATUMS.md. Values may change; names and the frame structure may not.
# Computed values (e.g. the lift's inertia tensor) are NOT stored here; upstream-owned values (option B's geometry, the arm) are read from upstream YAML.
schema_version: 1
revision: "2026-11-01.a"          # bump on every change to this file; goes into config_id (test_datums_revision.py enforces it)
units: {length: m, angle: rad, mass: kg}

# Datums that are reported but never feed the model (DATUMS.md rule 1).
report_only:
  - base_link_height_above_floor
  - drive_wheel_radius
  - envelope_max_height
  - envelope_max_width
  - envelope_max_depth
  - gross_mass_limit
  - f2s_vehicle_mass_estimate
  - joint_rest_margin_rad

# Datums whose xacro consumer has not been written yet: <datum>: <step that will consume it>.
# The step that adds the consumer deletes the entry in the same commit; T13 fails if it does not.
# Empty since S4 (the camera poses are now consumed by upper_sensors.xacro); kept so the mechanism stays visible.
pending_reference: {}

