    owner: "Alex (F2S) / supplier (DOLD)"
    note: "m/s. The velocity limit of lift_joint in the mock and gazebo profiles only (combined_robot.xacro): it is what MoveIt plans the lift under and what the simulated lift_controller follows. The real profile keeps effort 0 velocity 0 and no command interface (the lift node firmware owns the lift, CTL-017; the register LIFT motion rule is enforced there, not here). A no-load catalogue figure, not a measurement: under the arms' load the real column is slower. Simulation only."

