    value: 0.098
    source: plan
    status: provisional
    ref: "register CAMERAS, P-03 rev19.4 item 19 D3 update (Alex decision 16 Oct 2026, CAD Rev B): base_link 0.098 m above the floor (camera centre 144 mm = base_link 0.098 m + z 0.046 m); base_link at the drive-axle midpoint, base_footprint on the floor (register FRAMES-REP105, P-03 rev19.4: 'axle height', no number). platform-sw has the same 0.098 in base_footprint_joint (robo_urdf.urdf.xacro:20)"
    owner: "Alex (decision) / platform-sw (base frames)"
    note: "A placeholder from S3 to P14 (0.0635, read off the SolidWorks export origin and a 0.110 m wheel) because nobody had defined it. It is a decision record, not a measurement, so provisional. T04 (test_t04_optb_composition) asserts it equals the base_footprint -> base_link joint of the expansion, so a platform-sw change cannot leave it behind."

