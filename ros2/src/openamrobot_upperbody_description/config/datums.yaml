    owner: "Alex (F2S) / supplier (DOLD)"
    note: "N. The effort limit of lift_joint in the mock and gazebo profiles only (combined_robot.xacro), so the simulated column can hold and move the carriage; the real profile keeps effort 0 velocity 0 and no command interface. The push rating, not a holding figure (the 800 N held with power off is a register LIFT release-gate item, outside this repository). Simulation only."

