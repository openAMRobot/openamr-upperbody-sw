    axis_convention: {x: fore_aft, y: lateral}
    source: supplier
    status: provisional
    ref: "DOLD Hexalift telescopic lifters datasheet (version 2023_08_16), page 4, the two dimensioned drawings ('With mounting brackets' / 'Without mounting brackets'): 'Outer profile 240x60'. https://www.dold-mechatronik.de/documents/Datasheets/AluminumProfiles/TelescopicLifters/telescopic_lifters_en.pdf ; matches option B drawing sheet 2 rev A. Alex, 22 Oct 2026 (the 240 mm side fore-aft is option B's own statement, upperbody_configuration.yaml column.dold_v4_350.description)"
    owner: "Alex (option B drawing) / supplier (DOLD)"
    note: "Sourced since 28 Oct 2026 (P28). It was a placeholder [0.240, 0.240] whose lateral side was invented (set equal to x); it is no longer an invented number, and the CHANGELOG says so. The outer profile only: the moving stage is lift_inner_section. It sizes the inertia tensor of the column, the fixed stage's visual and collision box, and the adapter plate's rear edge. Provisional, not verified: the dimensions are read from a raster drawing in a supplier datasheet, not from a CAD model or a measured part. Column parent frame accepted by Alex on 30 Oct 2026 as modelled until supplier CAD (decision D4, P-03 rev20.1 item 25). Confirmed by the DOLD supplier CAD Hexalift_EB530_Hub350_mit_Montagelaschen.STEP (owner, 8 Nov 2026; P-03 rev20.4 item 28): static profile 240 x 60 mm from 10 to 503 mm above the column base. The foot with mounting tabs under the profile is lift_foot_size (drawn since 9 Nov 2026, roadmap parity, visual only); the fixed stage's 240 x 60 box still starts at the column base, so it is the fixed side's collision down to the plate."

